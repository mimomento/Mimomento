<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Priscila Pompolo · Puente Energético</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --sage: #7a8c6e;
    --sage-light: #a3b38f;
    --earth: #b5956a;
    --earth-light: #d4b896;
    --cream: #f5f0e8;
    --cream-deep: #ede5d4;
    --bark: #5c4a35;
    --bark-light: #7a6449;
    --moss: #4a5c3e;
    --sand: #e8dcc8;
    --white-warm: #faf7f2;
    --text: #3a3028;
    --text-soft: #6b5d4f;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; font-size: 112.5%; }

  body {
    font-family: 'Jost', sans-serif;
    background: var(--white-warm);
    color: var(--text);
    overflow-x: hidden;
  }

  /* ── HERO ── */
  .hero {
    min-height: 100vh;
    background: linear-gradient(160deg, var(--moss) 0%, var(--sage) 40%, var(--earth-light) 100%);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 20% 80%, rgba(181,149,106,0.25) 0%, transparent 60%),
      radial-gradient(ellipse 40% 60% at 80% 20%, rgba(90,114,76,0.3) 0%, transparent 60%);
  }

  .hero-texture {
    position: absolute;
    inset: 0;
    opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 200px;
  }

  /* Organic circles */
  .orb {
    position: absolute;
    border-radius: 60% 40% 70% 30% / 50% 60% 40% 50%;
    opacity: 0.12;
    animation: morph 12s ease-in-out infinite alternate;
  }
  .orb-1 {
    width: 500px; height: 500px;
    background: var(--cream);
    top: -100px; right: -100px;
    animation-duration: 14s;
  }
  .orb-2 {
    width: 300px; height: 300px;
    background: var(--earth-light);
    bottom: 50px; left: -50px;
    animation-duration: 10s;
    animation-delay: -5s;
  }
  @keyframes morph {
    0% { border-radius: 60% 40% 70% 30% / 50% 60% 40% 50%; }
    100% { border-radius: 40% 60% 30% 70% / 60% 40% 60% 40%; }
  }

  .hero-content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 2rem;
    animation: fadeUp 1.2s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .hero-eyebrow {
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    font-size: 0.75rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--earth-light);
    margin-bottom: 1.5rem;
    opacity: 0;
    animation: fadeUp 1s ease 0.3s both;
  }

  .hero h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(3rem, 8vw, 6.5rem);
    line-height: 1.05;
    color: var(--cream);
    margin-bottom: 1.5rem;
    opacity: 0;
    animation: fadeUp 1s ease 0.5s both;
  }

  .hero h1 em {
    font-style: italic;
    color: var(--earth-light);
  }

  .hero-sub {
    font-weight: 300;
    font-size: 1.15rem;
    color: rgba(245,240,232,0.75);
    max-width: 480px;
    margin: 0 auto 3rem;
    line-height: 1.7;
    opacity: 0;
    animation: fadeUp 1s ease 0.7s both;
  }

  .btn-primary {
    display: inline-block;
    padding: 1rem 2.5rem;
    background: var(--earth);
    color: var(--cream);
    font-family: 'Jost', sans-serif;
    font-weight: 400;
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-decoration: none;
    border: none;
    cursor: pointer;
    border-radius: 50px;
    transition: all 0.3s ease;
    opacity: 0;
    animation: fadeUp 1s ease 0.9s both;
    position: relative;
    overflow: hidden;
  }

  .btn-primary::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.1);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .btn-primary:hover::after { opacity: 1; }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(90,60,30,0.3); }

  .scroll-hint {
    position: absolute;
    bottom: 2.5rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    color: rgba(245,240,232,0.4);
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    animation: bounce 2s ease-in-out infinite;
  }

  .scroll-hint::after {
    content: '';
    width: 1px;
    height: 40px;
    background: linear-gradient(to bottom, rgba(245,240,232,0.4), transparent);
  }

  @keyframes bounce {
    0%,100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(6px); }
  }

  /* ── SESSIONS ── */
  .section {
    padding: 7rem 2rem;
    max-width: 1100px;
    margin: 0 auto;
  }

  .section-label {
    font-size: 0.7rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--sage);
    margin-bottom: 1rem;
    font-weight: 400;
  }

  .section-title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(2.2rem, 5vw, 3.5rem);
    color: var(--bark);
    line-height: 1.15;
    margin-bottom: 1rem;
  }

  .section-title em { font-style: italic; color: var(--sage); }

  .section-desc {
    font-weight: 300;
    font-size: 1.08rem;
    color: var(--text-soft);
    max-width: 500px;
    line-height: 1.8;
    margin-bottom: 4rem;
  }

  .sessions-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 2rem;
  }

  .session-card {
    background: var(--cream);
    border-radius: 20px;
    padding: 2.5rem;
    border: 1px solid var(--sand);
    position: relative;
    overflow: hidden;
    transition: all 0.4s ease;
    cursor: pointer;
  }

  .session-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--sage-light), var(--earth-light));
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.4s ease;
  }

  .session-card:hover::before { transform: scaleX(1); }
  .session-card:hover { transform: translateY(-4px); box-shadow: 0 20px 50px rgba(90,74,53,0.1); }

  .session-icon {
    width: 52px;
    height: 52px;
    background: linear-gradient(135deg, var(--sage-light), var(--sage));
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    margin-bottom: 1.5rem;
  }

  .session-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem;
    font-weight: 400;
    color: var(--bark);
    margin-bottom: 0.75rem;
  }

  .session-desc {
    font-size: 1rem;
    font-weight: 300;
    color: var(--text-soft);
    line-height: 1.7;
    margin-bottom: 1.5rem;
  }

  .session-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem 1rem;
    font-size: 0.78rem;
    color: var(--sage);
    letter-spacing: 0.05em;
  }

  .session-meta span {
    white-space: nowrap;
  }

  .session-meta span::before {
    margin-right: 0.3rem;
    opacity: 0.7;
  }

  /* ── DIVIDER ── */
  .divider {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--sand), transparent);
  }

  /* ── BOOKING ── */
  #reservar {
    background: var(--cream-deep);
  }

  .booking-wrapper {
    padding: 7rem 2rem;
    max-width: 900px;
    margin: 0 auto;
  }

  .booking-steps {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 3.5rem;
    align-items: center;
  }

  .step-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.78rem;
    font-weight: 400;
    color: var(--text-soft);
    opacity: 0.5;
    transition: opacity 0.3s;
  }

  .step-item.active { opacity: 1; color: var(--sage); }
  .step-item.done { opacity: 0.7; color: var(--earth); }

  .step-num {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1.5px solid currentColor;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem;
    flex-shrink: 0;
  }

  .step-item.done .step-num {
    background: var(--earth);
    border-color: var(--earth);
    color: white;
  }

  .step-item.active .step-num {
    background: var(--sage);
    border-color: var(--sage);
    color: white;
  }

  .step-line {
    flex: 1;
    height: 1px;
    background: var(--sand);
    min-width: 20px;
  }

  /* Step panels */
  .step-panel { display: none; }
  .step-panel.active { display: block; animation: fadeUp 0.4s ease both; }

  /* Step 1 - Session picker */
  .session-options {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 1.2rem;
    margin-bottom: 2.5rem;
  }

  .session-opt {
    padding: 1.8rem;
    border: 1.5px solid var(--sand);
    border-radius: 16px;
    cursor: pointer;
    background: var(--white-warm);
    transition: all 0.3s;
    position: relative;
  }

  .session-opt:hover { border-color: var(--sage-light); background: rgba(163,179,143,0.06); }

  .session-opt.selected {
    border-color: var(--sage);
    background: rgba(122,140,110,0.08);
  }

  .session-opt.selected::after {
    content: '✓';
    position: absolute;
    top: 1rem; right: 1rem;
    width: 22px; height: 22px;
    background: var(--sage);
    color: white;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem;
    line-height: 22px;
    text-align: center;
  }

  .opt-icon { font-size: 1.5rem; margin-bottom: 0.8rem; }
  .opt-name { font-family: 'Cormorant Garamond', serif; font-size: 1.25rem; color: var(--bark); margin-bottom: 0.4rem; }
  .opt-detail { font-size: 0.8rem; color: var(--text-soft); font-weight: 300; line-height: 1.5; }
  .opt-price { font-size: 0.85rem; color: var(--earth); margin-top: 0.8rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Step 2 - Calendar */
  .calendar-grid {
    background: var(--white-warm);
    border: 1px solid var(--sand);
    border-radius: 20px;
    padding: 2rem;
    margin-bottom: 2rem;
  }

  .cal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
  }

  .cal-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.4rem;
    color: var(--bark);
  }

  .cal-nav {
    background: none;
    border: 1px solid var(--sand);
    border-radius: 50%;
    width: 36px; height: 36px;
    cursor: pointer;
    font-size: 1rem;
    color: var(--text-soft);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }

  .cal-nav:hover { border-color: var(--sage); color: var(--sage); }

  .cal-days-header {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    color: var(--text-soft);
    margin-bottom: 0.8rem;
    text-transform: uppercase;
  }

  .cal-days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }

  .cal-day {
    aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--text);
  }

  .cal-day:hover:not(.disabled):not(.empty) { background: rgba(122,140,110,0.15); }
  .cal-day.available { color: var(--sage); font-weight: 500; }
  .cal-day.selected { background: var(--sage); color: white; }
  .cal-day.disabled { color: var(--sand); cursor: default; }
  .cal-day.empty { pointer-events: none; }
  .cal-day.today { border: 1.5px solid var(--earth-light); }

  .time-slots {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 0.7rem;
    margin-top: 1.5rem;
  }

  .time-slot {
    padding: 0.7rem;
    text-align: center;
    border: 1px solid var(--sand);
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.85rem;
    color: var(--text-soft);
    background: var(--white-warm);
    transition: all 0.2s;
  }

  .time-slot:hover { border-color: var(--sage); color: var(--sage); }
  .time-slot.selected { background: var(--sage); color: white; border-color: var(--sage); }
  .time-slot.unavailable { opacity: 0.35; cursor: default; pointer-events: none; }

  /* Step 3 - Contact */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.2rem;
    margin-bottom: 2rem;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .form-group.full { grid-column: 1 / -1; }

  label {
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-soft);
    font-weight: 400;
  }

  input, select, textarea {
    padding: 0.9rem 1.1rem;
    border: 1.5px solid var(--sand);
    border-radius: 12px;
    background: var(--white-warm);
    font-family: 'Jost', sans-serif;
    font-size: 0.95rem;
    font-weight: 300;
    color: var(--text);
    transition: border-color 0.2s;
    outline: none;
  }

  input:focus, select:focus, textarea:focus { border-color: var(--sage); }
  textarea { resize: vertical; min-height: 100px; }

  /* Step 4 - Payment */
  .payment-summary {
    background: var(--white-warm);
    border: 1px solid var(--sand);
    border-radius: 16px;
    padding: 2rem;
    margin-bottom: 2rem;
  }

  .summary-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--sand);
    font-size: 0.9rem;
    color: var(--text-soft);
  }

  .summary-row:last-child { border-bottom: none; font-weight: 500; color: var(--bark); font-size: 1rem; }

  .payment-methods {
    display: flex;
    gap: 1rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
  }

  .pay-method {
    flex: 1;
    min-width: 140px;
    padding: 1.2rem;
    border: 1.5px solid var(--sand);
    border-radius: 14px;
    cursor: pointer;
    text-align: center;
    background: var(--white-warm);
    transition: all 0.2s;
  }

  .pay-method:hover { border-color: var(--sage-light); }
  .pay-method.selected { border-color: var(--sage); background: rgba(122,140,110,0.07); }
  .pay-icon { font-size: 1.5rem; margin-bottom: 0.4rem; }
  .pay-name { font-size: 0.8rem; color: var(--text-soft); }

  .card-fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-bottom: 1.5rem;
  }

  .card-fields .full { grid-column: 1 / -1; }

  /* Navigation buttons */
  .step-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 2.5rem;
  }

  .btn-back {
    background: none;
    border: none;
    color: var(--text-soft);
    cursor: pointer;
    font-family: 'Jost', sans-serif;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    transition: color 0.2s;
    padding: 0.5rem 0;
  }

  .btn-back:hover { color: var(--bark); }

  .btn-next {
    padding: 0.9rem 2.5rem;
    background: var(--sage);
    color: white;
    border: none;
    border-radius: 50px;
    font-family: 'Jost', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.3s;
    text-transform: uppercase;
  }

  .btn-next:hover { background: var(--moss); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(74,92,62,0.25); }
  .btn-next:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* ── SUCCESS ── */
  .success-screen {
    text-align: center;
    padding: 4rem 2rem;
    display: none;
  }

  .success-screen.visible { display: block; animation: fadeUp 0.6s ease both; }

  .success-icon {
    width: 80px; height: 80px;
    background: linear-gradient(135deg, var(--sage-light), var(--sage));
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 2rem;
    margin: 0 auto 2rem;
    box-shadow: 0 10px 30px rgba(122,140,110,0.3);
  }

  .success-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.5rem;
    font-weight: 300;
    color: var(--bark);
    margin-bottom: 1rem;
  }

  .success-msg {
    color: var(--text-soft);
    font-weight: 300;
    line-height: 1.7;
    max-width: 420px;
    margin: 0 auto 2.5rem;
  }

  /* ── ABOUT strip ── */
  .about-strip {
    background: linear-gradient(135deg, var(--bark) 0%, var(--moss) 100%);
    padding: 6rem 2rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .about-strip::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity: 0.04;
  }

  .about-inner {
    position: relative;
    max-width: 700px;
    margin: 0 auto;
  }

  .about-quote {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(1.5rem, 4vw, 2.5rem);
    color: var(--cream);
    line-height: 1.4;
    margin-bottom: 2rem;
    font-weight: 300;
  }

  .about-name {
    font-size: 0.8rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--earth-light);
  }

  /* ── FOOTER ── */
  footer {
    background: var(--text);
    color: rgba(245,240,232,0.5);
    text-align: center;
    padding: 2.5rem;
    font-size: 0.8rem;
    font-weight: 300;
    letter-spacing: 0.05em;
  }

  footer a { color: var(--earth-light); text-decoration: none; }

  /* ── MOBILE ── */
  @media (max-width: 600px) {
    .form-grid { grid-template-columns: 1fr; }
    .card-fields { grid-template-columns: 1fr; }
    .booking-steps { gap: 0.25rem; }
    .step-item span:not(.step-num) { display: none; }
    .session-options { grid-template-columns: 1fr; }
    .sessions-grid { grid-template-columns: 1fr; }
  }

  /* ── ABOUT SECTION ── */
  .about-section {
    background: var(--cream-deep);
    padding: 7rem 2rem;
  }

  .about-flex {
    max-width: 1050px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 5rem;
    align-items: center;
  }

  .about-photo-wrap {
    position: relative;
  }

  .about-photo {
    width: 100%;
    border-radius: 30% 70% 60% 40% / 40% 50% 50% 60%;
    display: block;
    object-fit: cover;
    aspect-ratio: 4/5;
    position: relative;
    z-index: 2;
    box-shadow: 0 20px 60px rgba(74,92,62,0.2);
  }

  .about-photo-deco {
    position: absolute;
    inset: -14px;
    border-radius: 30% 70% 60% 40% / 40% 50% 50% 60%;
    border: 2px solid var(--sage-light);
    opacity: 0.4;
    z-index: 1;
    animation: morph 10s ease-in-out infinite alternate;
  }

  .about-bio {
    font-weight: 300;
    font-size: 1.08rem;
    color: var(--text-soft);
    line-height: 1.8;
    margin-bottom: 1rem;
  }

  .about-details {
    display: flex;
    flex-direction: column;
    gap: 1rem;
